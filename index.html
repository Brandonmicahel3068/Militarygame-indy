<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPERATION: TBD</title>
    <!-- Inline SVG favicon. Browsers ALWAYS request /favicon.ico; with no
         icon declared that's a guaranteed 404 in the console on every load.
         A data: URI means zero extra network requests. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a2416'/%3E%3Cpath d='M16 4l10 4v8c0 6-4 10-10 12C10 26 6 22 6 16V8z' fill='%237dff9b'/%3E%3C/svg%3E"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0b0f0a; overflow: hidden; font-family: "Courier New", monospace; }
      canvas { display: block; }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        color: #7dff9b;
        text-shadow: 0 0 8px rgba(125, 255, 155, 0.5);
        font-size: 14px;
        line-height: 1.6;
        pointer-events: none;
      }
      #hud .label { opacity: 0.55; }
      #hud .hint {
        margin-top: 10px;
        opacity: 0.45;
        font-size: 12px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div>&gt; OPERATOR ONLINE</div>
      <div><span class="label">UNIT:</span> RIFLEMAN — 01</div>
      <div><span class="label">STATE:</span> IDLE</div>
      <div class="hint">DRAG TO ORBIT &nbsp;/&nbsp; SCROLL TO ZOOM</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
